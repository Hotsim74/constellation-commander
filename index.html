<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121820">
<title>Constellation Commander</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>⭐</text></svg>">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121820;color:#e4e9ef;font-family:system-ui,sans-serif;text-align:center;padding:24px}
.card{max-width:420px}
h1{font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}
p{font-size:18px;line-height:1.5;margin:0 0 12px;color:#c9d1db}
.star{font-size:48px;margin-bottom:10px}
small{color:#8d99a8;font-size:14px}
</style>
</head>
<body>
<div class="card">
<div class="star">⭐</div>
<h1>Constellation Commander</h1>
<p>A new version is on its way: one board, no more switching screens, and the fog of war.</p>
<p>Back soon. This page will turn into the game on its own, nothing to reinstall.</p>
<small>Your rating and record are safe on your phone.</small>
</div>
<script>setInterval(async()=>{try{const r=await fetch(location.pathname,{cache:'no-store'});const t=await r.text();if(/const VERSION=/.test(t))location.reload();}catch(_){}},60000);</script>
</body>
</html>
